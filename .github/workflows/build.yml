name: Build ZeroPhone APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project & Compile APK
        run: |
          python3 - << 'PYEOF'
          import os

          # 1. Directly write Android SDK License hash (No sdkmanager needed!)
          sdk_root = os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")
          lic_dir = os.path.join(sdk_root, "licenses")
          os.makedirs(lic_dir, exist_ok=True)
          with open(os.path.join(lic_dir, "android-sdk-license"), "w") as f:
              f.write("\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n")

          # 2. Create App Directories
          os.makedirs("app/src/main/java/com/zerophone/vault", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)

          files = {}

          files["settings.gradle"] = r'''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZeroPhoneVault"
          include ':app'
          '''

          files["build.gradle"] = r'''plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          '''

          files["gradle.properties"] = r'''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          '''

          files["app/build.gradle"] = r'''plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.zerophone.vault'
              compileSdk 34

              defaultConfig {
                  applicationId "com.zerophone.vault"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          '''

          files["app/src/main/AndroidManifest.xml"] = r'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

              <application
                  android:allowBackup="true"
                  android:label="ZeroPhone Vault"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          '''

          files["app/src/main/java/com/zerophone/vault/MainActivity.kt"] = r'''package com.zerophone.vault

          import android.app.AppOpsManager
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Process
          import android.provider.Settings
          import android.provider.Telephony
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.view.ActionMode
          import android.view.Gravity
          import android.view.Menu
          import android.view.MenuItem
          import android.widget.*
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import java.util.Calendar

          class MainActivity : AppCompatActivity(), SensorEventListener {

              private lateinit var prefs: android.content.SharedPreferences
              private var sensorManager: SensorManager? = null
              private var stepSensor: Sensor? = null
              private var emergencyStepsWalked = 0
              private var tvStepCounter: TextView? = null

              private val addictiveApps = listOf(
                  "com.instagram.android",
                  "com.google.android.youtube",
                  "com.facebook.katana",
                  "com.snapchat.android",
                  "com.android.chrome",
                  "in.mohalla.video"
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("ZeroPhonePrefs", Context.MODE_PRIVATE)
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  stepSensor = sensorManager?.getDefaultSensor(Sensor.TYPE_STEP_DETECTOR)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          showHomeOrContract()
                      }
                  })

                  showHomeOrContract()
              }

              override fun onResume() {
                  super.onResume()
                  showHomeOrContract()
              }

              private fun showHomeOrContract() {
                  val todayKey = getTodayDateKey()
                  val lockedDate = prefs.getString("contract_date", "")
                  if (lockedDate != todayKey) {
                      renderScreen1MorningContract()
                  } else {
                      renderScreen2MinimalistHome()
                  }
              }

              private fun getTodayDateKey(): String {
                  val cal = Calendar.getInstance()
                  return "${cal.get(Calendar.YEAR)}-${cal.get(Calendar.DAY_OF_YEAR)}"
              }

              private fun renderScreen1MorningContract() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.BLACK)
                      setPadding(64, 100, 64, 64)
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val title = TextView(this).apply {
                      text = "🛡️ ZEROPHONE VAULT"
                      textSize = 26f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }

                  val sub = TextView(this).apply {
                      text = "\nApne Aaj Ke Waqt Ki Keemat Tay Karein\n\n• WhatsApp Active Limit : 2 Hours Free\n  (Quick reply <30s count nahi hoga)\n\n• Reels / Vault Limit : 1 Hour Free\n  (Instagram, YouTube, FB,
